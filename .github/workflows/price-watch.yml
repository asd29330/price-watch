name: Price Watch

on:
  schedule:
    # 每小时跑一次（Jina 免费额度每月 1000 次，每小时约 720 次够用）
    - cron: '*/10 9-23 * * *'
  workflow_dispatch:

concurrency:
  group: price-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 巡检一次并推送
        run: python price_watch_cloud.py --once
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
