name: Price Watch

on:
  schedule:
    # 北京时间 9:00-23:00 每 10 分钟跑一次（GitHub cron 用 UTC，所以写 1-15）
    - cron: '*/10 1-15 * * *'
  workflow_dispatch:

concurrency:
  group: price-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 巡检一次并推送
        run: python price_watch_cloud.py --once
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
