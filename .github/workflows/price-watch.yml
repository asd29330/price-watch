name: Price Watch

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: price-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 巡检一次并推送
        run: python price_watch_cloud.py --once
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
